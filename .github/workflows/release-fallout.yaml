# Fallout release. Pushing a fo4-vX.Y.Z tag on main builds devbench.dll (Fallout 4 and Fallout 4 VR, one DLL)
# and the bridge exe, packs them as an MO2-ready archive and creates a DRAFT GitHub Release with it attached;
# publishing the draft is manual.
#
# The version is the one in CMakeLists.txt, never bumped here: the tag must carry it, and the `fo4-` prefix only
# keeps the tag apart from the Skyrim release's vX.Y.Z. That number is also GetBuildNumber(), which mods compare
# before calling late API slots, so a Fallout release must not invent one. The Python client (setuptools-scm,
# `--match fo4-v*`) resolves the same tag to the same version. Skyrim's release.yaml (semantic-release, push to
# main) is a separate pipeline; neither triggers the other.
#
# Release notes: the tag's annotation (`git tag -a`), else the commit subjects since the previous fo4-v tag.
name: Release (Fallout)

on:
  push:
    tags: ["fo4-v*"]

permissions:
  contents: read

concurrency:
  group: release-fallout-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is fo4-vX.Y.Z on main, X.Y.Z the CMakeLists.txt version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^fo4-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::$TAG is not fo4-vX.Y.Z"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          file=$(sed -nE 's/^set\(VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' CMakeLists.txt)
          if [ "$file" != "$version" ]; then
            echo "::error::$TAG does not match CMakeLists.txt's VERSION ($file); tag fo4-v$file instead"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/_build-fallout.yaml
    with:
      ref: ${{ github.ref_name }}

  release:
    name: Package & draft release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and attach the archive
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # On a tag push, checkout can leave the tag as a lightweight ref; refetch so an annotation is readable.
      - name: Fetch annotated tags
        run: git fetch --force --tags origin

      # The client must resolve this tag to the version the DLL was built with.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check the Python client's version
        run: |
          set -euo pipefail
          python -m pip install --quiet ./clients/python
          got=$(python -c "import devbench; print(devbench.__version__)")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::devbench-client resolves $got, expected $VERSION"
            exit 1
          fi

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: bin

      - name: Download bridge binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.bridge-artifact-name }}
          path: bin-bridge

      # F4SE/ at the archive root, so MO2 installs it as a mod without asking where the data folder is.
      # No config.json (the plugin writes a documented one on first run), no Skyrim recordings, no
      # DevBenchAPI.h (mods vendor it from source or the vcpkg port).
      - name: Assemble mod archive
        id: pkg
        run: |
          set -euo pipefail
          stage=stage
          mkdir -p "$stage/F4SE/Plugins/devbench"
          cp bin/devbench.dll bin/devbench.pdb "$stage/F4SE/Plugins/"
          cp bin-bridge/devbench-bridge.exe "$stage/F4SE/Plugins/devbench/"
          archive="devbench-${TAG}.7z"
          (cd "$stage" && 7z a -t7z -mx=9 "../$archive" F4SE)
          7z l "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" > notes.md
          elif prev=$(git describe --tags --abbrev=0 --match 'fo4-v*' "$TAG^" 2>/dev/null); then
            { echo "Changes since $prev:"; echo; git log --no-merges --format='- %s' "$prev..$TAG"; } > notes.md
          else
            echo "First Fallout release." > notes.md
          fi
          cat notes.md

      # A re-run updates the existing draft instead of failing on it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$ARCHIVE" --draft --verify-tag \
              --title "devbench $TAG (Fallout 4 / Fallout 4 VR)" --notes-file notes.md
          fi
